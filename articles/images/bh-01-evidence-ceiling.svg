<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 700" font-family="system-ui,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <style>
      .t{font-size:34px;font-weight:800;fill:#1F2733}
      .st{font-size:21px;fill:#5A6472}
      .h1{font-size:25px;font-weight:800;fill:#1F2733}
      .bd{font-size:22px;fill:#1F2733}
      .sc{font-size:36px;font-weight:800}
      .zh{font-size:24px;font-weight:800;fill:#1F2733}
      .mu{font-size:21px;fill:#5A6472}
      .card{fill:#FFFFFF;stroke:#D6DBE3;stroke-width:1.6}
    </style>
  </defs>

  <rect width="640" height="700" fill="#F7F8FA"/>
  <text x="30" y="48" class="t">图 A · 证据状态决定分数上限</text>
  <text x="30" y="80" class="st">「装了工具」不等于「用得好」</text>

  <line x1="40" y1="420" x2="600" y2="420" stroke="#B4BCC8" stroke-width="2"/>

  <g>
    <rect x="40"  y="325" width="100" height="95"  rx="7" fill="#E4572E"/>
    <text x="90"  y="311" text-anchor="middle" class="sc" fill="#E4572E">59</text>
    <text x="90"  y="456" text-anchor="middle" class="zh">未观测</text>
    <text x="90"  y="482" text-anchor="middle" class="mu">机制不存在</text>

    <rect x="155" y="255" width="100" height="165" rx="7" fill="#E8A33D"/>
    <text x="205" y="241" text-anchor="middle" class="sc" fill="#B8791C">74</text>
    <text x="205" y="456" text-anchor="middle" class="zh">存在</text>
    <text x="205" y="482" text-anchor="middle" class="mu">配置里有</text>

    <rect x="270" y="205" width="100" height="215" rx="7" fill="#4C9AF5"/>
    <text x="320" y="191" text-anchor="middle" class="sc" fill="#2F6FED">84</text>
    <text x="320" y="456" text-anchor="middle" class="zh">被路由</text>
    <text x="320" y="482" text-anchor="middle" class="mu">任务能走到</text>

    <rect x="385" y="155" width="100" height="265" rx="7" fill="#12A594"/>
    <text x="435" y="141" text-anchor="middle" class="sc" fill="#0E7A5F">94</text>
    <text x="435" y="456" text-anchor="middle" class="zh">被执行</text>
    <text x="435" y="482" text-anchor="middle" class="mu">真用了它</text>

    <rect x="500" y="120" width="100" height="300" rx="7" fill="#7B61FF"/>
    <text x="550" y="106" text-anchor="middle" class="sc" fill="#7B61FF">100</text>
    <text x="550" y="456" text-anchor="middle" class="zh">有结果</text>
    <text x="550" y="482" text-anchor="middle" class="mu">结果支持</text>
  </g>

  <g>
    <rect x="30" y="512" width="580" height="112" rx="12" class="card" stroke="#2F6FED" stroke-width="2"/>
    <text x="56" y="546" class="h1" fill="#2F6FED">两条堵死自欺的规则</text>
    <text x="56" y="580" class="bd">超 75 分：要核对过的归属＋已执行的验证</text>
    <text x="56" y="608" class="bd">分数永不制造也不压制发现</text>
  </g>

  <text x="30" y="654" class="h1" fill="#A8341A">本仓库实测：分数会不升反降</text>
  <text x="30" y="684" class="bd">可靠交付 52 → 50，因为缺口从「推断」变成「观察到」。</text>
</svg>
