<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 782" font-family="system-ui,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <marker id="a1" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#5A6472"/></marker>
    <style>
      .t{font-size:34px;font-weight:800;fill:#1F2733}
      .st{font-size:21px;fill:#5A6472}
      .h1{font-size:25px;font-weight:800;fill:#1F2733}
      .en{font-size:23px;font-weight:800}
      .bd{font-size:22px;fill:#1F2733}
      .mu{font-size:21px;fill:#5A6472}
      .card{fill:#FFFFFF;stroke:#D6DBE3;stroke-width:1.6}
    </style>
  </defs>

  <rect width="640" height="782" fill="#F7F8FA"/>
  <text x="30" y="48" class="t">图 B · 三通道隔离取证</text>
  <text x="30" y="80" class="st">Step 1–2 · 一次冻结，各喂各的读者</text>

  <g>
    <rect x="30" y="100" width="580" height="86" rx="12" class="card" stroke="#2F6FED" stroke-width="2.2"/>
    <text x="320" y="136" text-anchor="middle" class="h1">Step 1 · 证据包一次冻结</text>
    <text x="320" y="166" text-anchor="middle" class="mu">范围 · 深度 · 时间窗只定一次</text>
  </g>
  <line x1="320" y1="186" x2="320" y2="212" stroke="#5A6472" stroke-width="2" marker-end="url(#a1)"/>

  <rect x="30" y="216" width="580" height="392" rx="14" fill="none" stroke="#B4BCC8" stroke-width="2" stroke-dasharray="9 7"/>

  <g>
    <rect x="50" y="238" width="540" height="112" rx="10" class="card"/>
    <rect x="50" y="238" width="12" height="112" rx="6" fill="#2F6FED"/>
    <text x="80" y="272" class="en" fill="#2F6FED">sessionEvidence</text>
    <text x="570" y="272" text-anchor="end" class="mu">Agent 1 · 只读</text>
    <text x="80" y="306" class="bd">只看：会话事实、已解析范围</text>
    <text x="80" y="336" class="bd">禁看：项目文件、已配置资产</text>
  </g>

  <g>
    <rect x="50" y="366" width="540" height="112" rx="10" class="card"/>
    <rect x="50" y="366" width="12" height="112" rx="6" fill="#12A594"/>
    <text x="80" y="400" class="en" fill="#0E7A5F">projectHarness</text>
    <text x="570" y="400" text-anchor="end" class="mu">Agent 2 · 只读</text>
    <text x="80" y="434" class="bd">只看：仓库、git 历史、当前 diff</text>
    <text x="80" y="464" class="bd">禁看：另两条通道的结论</text>
  </g>

  <g>
    <rect x="50" y="494" width="540" height="112" rx="10" class="card"/>
    <rect x="50" y="494" width="12" height="112" rx="6" fill="#7B61FF"/>
    <text x="80" y="528" class="en" fill="#7B61FF">agentCustomize</text>
    <text x="570" y="528" text-anchor="end" class="mu">Agent 3 · 只读</text>
    <text x="80" y="562" class="bd">只看：lint、inventory、integrity</text>
    <text x="80" y="592" class="bd">禁看：重跑收集命令、他人结论</text>
  </g>

  <g>
    <rect x="30" y="628" width="580" height="126" rx="12" fill="#FFF6E8" stroke="#E8A33D" stroke-width="2"/>
    <text x="56" y="666" class="h1" fill="#8A5B12">隔离是硬约束，不是建议</text>
    <text x="56" y="700" class="bd">恰好 3 个 Agent，谁都不许再委托；</text>
    <text x="56" y="730" class="bd">通道互不可见，否则会开始互相「圆场」。</text>
  </g>
</svg>
