# ---------------------------------------------------------------------------
# Builtin review checklist (review_changes BUILTIN_CHECKLISTS)
# questions are pipe-separated (the catalog stays a flat string map)
# ---------------------------------------------------------------------------
review_checklist:
  all:
    err-handling:
      title: "Error handling and resource cleanup"
      questions: "Are exceptions or errors swallowed (bare except, ignored return value, dropped error)?|Are files, connections and locks released in finally / with / defer?|Is error context preserved (original exception, key parameters propagated with the error)?"
    input-validation:
      title: "Input validation"
      questions: "Is external input (arguments, user data, file contents) validated at the entry point?|Are boundary values handled (empty, oversized, negative, zero, out of range)?|Are type/format assumptions explicit rather than relying on callers?"
    logging:
      title: "Logging"
      questions: "Are key paths logged (errors, slow paths, state changes)?|Do logs carry the context needed to locate an issue (ids, argument summaries) rather than only a stack trace?|Are high-frequency logs avoided in loops or hot paths?"
    security:
      title: "Security"
      questions: "Is there injection risk (SQL/command/template built from external input)?|Are secrets, tokens or passwords hardcoded or written to logs?|Does path concatenation allow traversal (unvalidated relative paths)?"
    concurrency:
      title: "Concurrency safety"
      questions: "Is shared mutable state guarded by a lock or synchronization?|Are there races (check-then-write, non-atomic updates)?|Is any new global or module-level mutable state thread-safe?"
    null-boundary:
      title: "Null and boundary conditions"
      questions: "Are null/None/empty-collection accesses guarded?|Are empty collections, index overruns and division by zero handled?|Are loop termination conditions correct (off-by-one)?"
    testability:
      title: "Testability"
      questions: "Can the new logic be tested in isolation (no hardcoded dependencies, time or randomness)?|Are side effects (IO, network, DB) confined to mockable boundaries?|Do tests cover the key branches of this change?"
    backward-compat:
      title: "Backward compatibility"
      questions: "Do public interface or data-structure changes break existing callers?|Could changed default behavior affect callers that pass nothing explicitly?|Is there a transition period for deletions or renames, with every reference updated?"
    performance:
      title: "Performance"
      questions: "Are there obvious N+1 queries or heavy work inside loops (IO, regex compilation, DB calls)?|Do the new data structures or algorithms match the expected scale?|Are unnecessary copies or serializations introduced?"
    code-quality:
      title: "Code quality"
      questions: "Is there duplicated logic worth extracting (already implemented in this file or module)?|Do names accurately reflect behavior (no misleading names)?|Is there dead code, unused variables, or comments that disagree with the code?"
  python:
    py-mutable-default:
      title: "Mutable default arguments"
      questions: "Is any function argument default a mutable object (list/dict/set) — state shared across calls?"
    py-bare-except:
      title: "Bare except"
      questions: "Is a bare except / except Exception used, swallowing exceptions including KeyboardInterrupt?"
    py-resource-context:
      title: "Resource context management"
      questions: "Are files, sockets and locks managed with the with statement?"
    py-encoding:
      title: "Encoding handling"
      questions: "Do file reads and writes specify encoding explicitly (GBK/UTF-8 differences across platforms)?"
    py-import-side-effect:
      title: "Import side effects"
      questions: "Does importing the module trigger heavy side effects (network, file writes, DB connections)?"

# ---------------------------------------------------------------------------
# Tool-returned hints (scattered one-liners shown to the agent)
# ---------------------------------------------------------------------------
tools:
  note_query:
    by_file_hint: "This file has {total} historical knowledge entries (~{total_est} tokens). Returned the top {count} by specificity. Start as soon as you have enough; use mode=detail to read a single note in full."
    by_file_empty: "No historical knowledge is linked to this file (no related_modules hit in notes/). This may be a knowledge gap worth filling with ingest_note once the task is done."
  doc_writer:
    stale_code_advisory: "code_fingerprint drift: this page was generated from a different code state (old {old_fp}… → new {new_fp}…), and this write overwrites it. Conclusions on the old page may be stale — review it with lint_wiki stale_pages."
  review_changes:
    no_spec_note: "No SPEC found — only general correctness can be reviewed; missing or out-of-scope work cannot be detected"
  wiki_lint:
    stale_note_suggestion: "Unverified for {overdue_days} days. If it is still accurate, renew it with confirm_note(note_file=\"{rel_path}\") (refreshes stale_after per the type window); if it is outdated, retire it with reject_note."
    low_adoption_suggestion: "Recalled often but adopted zero times: content is likely relevant but not actionable enough. Consider rewriting it in a more executable form (concrete steps / commands / expected results) — draft it via distill_conversation then confirm_note, or update it directly with edit_doc_file on {rel_path}."
    check_done: "Lint complete: {count} issue(s)"
  task_manager:
    compact_instruction: "Read entries_to_compress (if existing_summary is non-empty it holds the previously compressed summary — the new summary should supersede it) and write a Markdown summary of the task's early memories in English, at most {max_chars} characters. Cover: key facts and decisions already made, open questions, and context that may still affect later work (past pitfalls, conventions, external dependencies). Drop pure process detail, keep conclusions. Then call compact_task_memories(mode='submit', task_id=..., summary=...)."
  prompt_server:
    draft_template: |
      📝 Knowledge capture candidates ({n})

      1. [{note_type/page_type}] {title}
         Background: {one line}
         Conclusion: {one line}
         Applies to: {when this applies}

      2. ...

      Which should I record? (all / pick numbers / skip)
  workspace_bootstrap:
    layout_question: "First-time initialization of a multi-repo workspace needs a knowledge-layout decision: ask the user first, then re-invoke init_workspace with the layout argument once you have the answer."
    layout_colocated: "Each business repo carries its own repowiki; docs evolve alongside the code and retrieval takes two hops (product level, then repo level)"
    layout_centralized: "All knowledge is centralized in this workspace's repowiki; business repos are pure code directories and retrieval takes one hop"
  distill_conversation:
    merge_marker: "> Merged from distillation candidate: {title}"
    friction_hint: "Tip: conversations with friction_score ≥ 20 carry clear friction signals (corrections / interruptions / repetition); distilling them first is more likely to produce valuable experience notes (the list is sorted by captured_at ascending; friction_score lets you reprioritize)."
