# CodeWiki MCP 多语言语料（中文源，唯一事实源）
#
# 规则：
# 1. zh.yaml 是源语言（最全）；en.yaml 必须覆盖本文件全部 key（tests/test_i18n.py 断言）。
# 2. 缺失 key 不做运行时回退——返回 [missing-i18n-key <key>] 哨兵并告警，
#    靠发版前的 key 集一致性测试保证不漏。
# 3. 模板占位符用 str.format 语法：{name} 为占位符，字面 { } 写作 {{ }}。
#    含占位符的文本必须通过 i18n.t(key, **vars) 获取。
# 4. key 命名：<领域>.<对象>.<字段/片段>，例如 server.instructions / prompts.init_wiki.title。

server:
  # MCP initialize 握手时注入给 Agent 的会话指引（原 server.py _SERVER_INSTRUCTIONS）。
  # 数量表述已按 R3 定案修正：注册 22 个 Prompt，不再是漂移的 "11 个"。
  instructions: |-
    CodeWiki-CN MCP Server — 代码结构分析 + Wiki 文档生成 + LLM 知识库管理平台。

    ## 能力概览
    - **代码分析**: Tree-sitter AST 解析 → 函数级调用图 → 依赖索引 → 传递性影响分析（无需 LLM）
    - **Wiki 生成**: 模块化文档生成流水线（分析→聚类→逐模块撰写→总览→质检）
    - **LLM Wiki 知识库**: BM25 全文搜索 + wikilink 图谱多跳扩展 + 结构化笔记
    - **外部文档管理**: 导入 PDF/MD/DOCX/HTML → 知识抽取 → 实体/概念页面
    - **质量保障**: 文档-代码一致性检查（过时引用、断链、覆盖率、循环依赖）
    - **工作流指引**: 22 个 Prompt 模板（generate-wiki, extract-knowledge, search-wiki, ingest-note 等）
    - **上下文资源**: Wiki 目录 (codewiki://wiki/catalog)、模块树 (codewiki://wiki/module-tree)、搜索索引状态 (codewiki://wiki/index-status)

    ## 核心工作流

    ### 1. 代码分析（独立使用，无需生成 Wiki）
    analyze_repo → list_components / list_dependencies / analyze_impact / read_code_components

    典型场景：
    - 调用链查询: list_dependencies(component_ids, direction="both") 查看直接调用关系
    - 修改影响评估: analyze_impact(component_ids 或 file_paths, direction="depended_by") 查看传递性影响范围（谁依赖我）、模块级聚合、高风险组件
    - 依赖全景: analyze_impact(direction="both", include_paths=true) 获取完整调用链路径
    - 代码阅读: read_code_components(component_ids) 读取源码

    分析结果持久化在 SQLite 中。用户可以只做分析不生成文档，之后随时基于缓存数据继续生成 Wiki（增量模式自动复用已有分析）。

    ### 2. Wiki 生成（完整流水线）
    analyze_repo → get_prompt('cluster') → save_module_tree → get_processing_order → 逐模块: get_prompt('user') + read_code_components → write_doc_file → close_session

    若已有分析缓存，analyze_repo 增量模式自动跳过未变更文件，直接进入文档生成。

    ### 3. 知识库搜索
    query_wiki(query, hop=1) → 查看结果 → query_wiki(query, expand=true) 深度阅读

    ### 4. 外部文档知识抽取（两阶段）
    ingest_source → get_prompt('extraction_scan') 骨架提取（只识别不撰写）→ query_wiki + get_prompt('extraction_dedup') 去重（create/merge/drop）→ 证据校验（行范围引用必须实质性讨论）→ write_doc_file / edit_doc_file(page_type='entity'/'concept'/'source') → [[wikilink]] 建图

    ### 5. 经验归档
    ingest_note(note_type, title, content) → 自动索引 → query_wiki 可检索

    ## 关键约束
    - **大文件传输**: 分析结果（组件索引、源码、依赖图）写入 workspace 文件，通过返回的 file_path 读取，不经 MCP 通道传输
    - **会话管理**: analyze_repo 创建会话（2h TTL，最多 10 个），close_session 触发索引重建和清理
    - **增量更新**: 若 output_dir 已有 .meta/metadata.json，analyze_repo 返回 changes 字段标识变更
    - **Mermaid 校验**: write_doc_file / edit_doc_file 自动校验 Mermaid 图表语法
    - **page_type 路由**: module→wiki/modules/, entity→wiki/entities/, concept→wiki/concepts/, source→wiki/sources/
    - **filename 规则**: write_doc_file 的 filename 参数只传纯文件名（如 "UserService.md"），禁止包含目录路径。目录由 page_type 自动路由，传 "entities/X.md" 会导致路径错误

    ## 推荐使用流程
    1. 代码分析: analyze_repo → analyze_impact / list_dependencies（无需后续 Wiki 步骤）
    2. 生成 Wiki: 调用 Prompt "generate-wiki" 获取完整步骤
    3. 知识抽取: 调用 Prompt "extract-knowledge" 获取完整步骤
    4. 知识归档: 调用 Prompt "ingest-note" 归档设计决策和经验教训
    5. 搜索知识库: 调用 Prompt "search-wiki" 获取搜索策略
    6. 质量检查: lint_wiki(checks=["all"]) → flag_issue 记录问题
    7. 对话采集: 调用 Prompt "team-memory-hook" 启用/关闭 IDE 对话自动采集（可选）
    8. 对话蒸馏: 调用 Prompt "distill-conversations" 从已采集对话中提取经验笔记

    ## 语言
    所有产出使用中文——Wiki 文档、笔记、commit message、代码注释、给用户的回复，以及写入 AGENTS.md 等落盘文件的文案，除非用户明确要求其他语言。工作流指引本身是中文的，但那是给你的指令，不代表产出语言。

# ---------------------------------------------------------------------------
# Prompt 元数据（prompts/list、get_prompt、codewiki://prompts/catalog 共用同一份）
# key: prompts.<prompt name>.{title,description,args.<arg name>}
# ---------------------------------------------------------------------------
prompts:
  get:
    description: "CodeWiki 工作流指引: {name}"
    unknown:
      title: "未知的 Prompt 模板"
      text: "未知的 Prompt 模板: {name}。可用模板: {available}"

  init-wiki:
    title: "初始化单仓Wiki工作区"
    description: "零配置初始化：创建目录结构、拷贝带注释的 schema.yaml 模板、写入 AGENTS.md（含使用建议和自我反思协议）。在开始任何 Wiki 生成或知识管理之前执行一次。"
    args:
      repo_path: "仓库根目录路径（相对路径基于当前工作目录，默认当前目录）"
      enable_task_management: "是否启用任务管理（跨会话任务记忆）：true/1 会在初始化指引中追加任务管理启用说明（注册 SessionEnd 采集 Hook + 向 AGENTS.md 写入任务引导段，新建会话时提示用户关联/新建任务）；留空或 false 则跳过。默认关闭。"

  init-workspace:
    title: "初始化多仓WIKI工作区"
    description: "把当前工作目录初始化（或重新同步）为多仓工作区：生成 bootstrap 克隆脚本、.gitignore、repo-map 导航骨架、AGENTS.md 工作区约定与产品级 repowiki。首次初始化必须先询问用户知识布局（colocated/centralized）再带 layout 调用，布局记录写入 repowiki/.meta/workspace.json；重跑零配置幂等——痕迹齐备时为 clone-only 接管（只补缺业务仓克隆，不触碰骨架与 AGENTS.md），骨架有缺失才补齐产物并强制刷新约定块。业务仓登记走 add_workspace_repo。"

  add-workspace-repo:
    title: "登记业务仓到多仓工作区"
    description: "按克隆 URL 把业务代码仓库登记进已初始化的 harness 工作区：目录名自动取仓库名，事务式同步 bootstrap.sh/ps1 登记表、.gitignore、repo-map.md，并默认克隆。重复登记同名同 URL 是空操作。"
    args:
      workspace_path: "工作区根目录（默认当前工作目录）"
      url: "业务仓 git 克隆 URL（必填；目录名自动取仓库名）"
      clone: "登记后立即克隆（默认 true）"

  remove-workspace-repo:
    title: "从多仓工作区移除业务仓"
    description: "按子目录名把业务代码仓库从 harness 工作区移除：事务式清理 bootstrap.sh/ps1 登记表、.gitignore、repo-map.md，并删除本地 clone 目录（不可恢复）。"
    args:
      workspace_path: "工作区根目录（默认当前工作目录）"
      name: "业务仓子目录名（登记时的目录名，必填）"

  generate-wiki:
    title: "生成单仓代码 Wiki"
    description: "完整的代码仓库 Wiki 生成流水线：分析→聚类→逐模块撰写→总览→质检→关闭会话"
    args:
      repo_path: "要分析的代码仓库路径（相对路径基于当前工作目录，默认当前目录）"

  incremental-update:
    title: "更新单仓代码 Wiki"
    description: "检测代码变更并增量更新受影响的 Wiki 模块文档"
    args:
      repo_path: "代码仓库路径（相对路径基于当前工作目录，默认当前目录）"

  code-analysis:
    title: "单仓代码结构分析（不生成 Wiki）"
    description: "仅解析代码结构、构建函数级调用图、查询依赖和评估修改影响范围，不生成任何 Wiki 文档。分析结果缓存在 SQLite 中，后续可随时继续生成 Wiki。"
    args:
      repo_path: "要分析的代码仓库路径（相对路径基于当前工作目录，默认当前目录）"

  workspace-analysis:
    title: "生成/更新多仓代码Wiki（含跨服务拓扑）"
    description: "扫描父目录下的多个 git 仓库，为每个生成独立 Wiki 并自动执行跨服务分析：RouteNode 匹配（HTTP+MQ，覆盖 Py/Java/JS/TS/Go）、Mermaid 服务拓扑图、基础设施扫描（docker-compose/.env/application.yml）。可搭配 codebase-memory-mcp 做语义级深度追踪。"
    args:
      workspace_path: "包含多个 git 仓库的父目录路径（相对路径基于当前工作目录，默认当前目录）"

  cross-service-trace:
    title: "跨服务调用链追踪"
    description: "对指定根服务执行跨服务调用链分析：先走 CodeWiki RouteNode 静态匹配（HTTP 路由 + MQ 生产者/消费者），再用 codebase-memory-mcp trace_path(mode='cross_service') 做多跳语义追踪，产出调用链图 + 架构诊断（循环依赖/扇入热点/未匹配路由）。"
    args:
      workspace_path: "包含多个 git 仓库的工作区根目录（相对路径基于当前工作目录，默认当前目录；须已执行过 analyze_workspace）"
      filter_value: "追踪起点：服务名 / HTTP 方法 / URL 子串 / 路径前缀（可在对话中补充）"

  search-wiki:
    title: "知识库搜索"
    description: "高效搜索 Wiki 知识库的策略指引：BM25 搜索、图谱扩展、深度阅读"
    args:
      query: "搜索关键词或自然语言问题"

  quality-check:
    title: "文档质量审计"
    description: "对已生成的 Wiki 执行全面质量检查：过时引用、断链、覆盖率、循环依赖"
    args:
      repo_path: "仓库根目录路径（相对路径基于当前工作目录，默认当前目录）"

  impact-review:
    title: "修改影响范围评估"
    description: "对指定组件或文件执行传递性影响分析（BFS 遍历），评估修改的爆炸半径：谁依赖我（depended_by）或我依赖谁（depends_on），输出模块级聚合、高风险组件识别和完整调用链路。"
    args:
      repo_path: "代码仓库路径（须已执行过 analyze_repo 或 code-analysis）"
      target: "分析目标：组件 ID（如 src/auth.py::AuthService）或文件路径（留空可在对话框中填写）"

  change-review:
    title: "变更评估与代码评审"
    description: "对最近代码变更（commit 范围或未提交变更）执行影响范围分析与代码评审：git diff 行级解析定位变更函数，传递性影响半径 + 回归测试建议；再经 review_changes 按四轴（spec/convention/module_knowledge/general）收集评审依据，检查变更是否正确、是否符合规范与历史教训。与 impact-review 互补：impact-review 用于修改前对指定组件评估，change-review 用于修改后对 diff 评估与评审。"
    args:
      repo_path: "代码仓库路径（须已执行过 analyze_repo 或 code-analysis）"
      since: "已提交范围 git diff <since>..HEAD（如 HEAD~1 或 commit hash）；留空默认分析未提交变更（worktree）"

  architecture-review:
    title: "架构审查与热点分析"
    description: "通过依赖图分析理解代码库的高层架构：识别核心层/服务层/应用层、发现依赖热点和耦合风险、定位入口点和模块边界。"
    args:
      repo_path: "代码仓库路径（相对路径基于当前工作目录，默认当前目录）"

  extract-knowledge:
    title: "外部文档知识抽取"
    description: "导入外部文档并从中抽取实体和概念，生成结构化知识页面并构建 wikilink 图谱。两阶段流程：骨架提取→去重检查→证据校验→页面撰写。"
    args:
      source_path: "要导入并提取知识的外部文档的绝对路径（支持 PDF/MD/DOCX/HTML）"
      repo_path: "仓库根目录路径（相对路径基于当前工作目录，默认当前目录）"
      granularity: "提取粒度：focused（3-7 核心项）| standard（适中覆盖）| exhaustive（应提尽提）。缺省遵循 schema.yaml 的 extraction_granularity"

  ingest-note:
    title: "经验知识归档"
    description: "将设计决策、经验教训、架构 rationale、踩坑记录等知识归档到 Wiki 知识库。支持 8 种笔记类型，自动 BM25 索引，可通过 query_wiki 检索。"
    args:
      repo_path: "仓库根目录路径（相对路径基于当前工作目录，默认当前目录）"
      note_type: "笔记类型：decision | lesson | architecture | bug_fix | pitfall | known_issue | workaround | general（默认 general）"

  team-memory-hook:
    title: "启用/禁用任务管理（跨会话任务记忆）"
    description: "管理跨会话任务记忆：启用时注册 SessionEnd 采集 Hook 并向 AGENTS.md 写入任务引导段（新建会话时提示用户关联已有任务或输入任务名新建），关闭时一并移除。采集仅落 raw 不蒸馏。"
    args:
      action: "要执行的动作：enable（启用）| disable（关闭）；留空则先检查现状再按用户意愿选择"
      repo_path: "仓库根目录路径（相对路径基于当前工作目录，默认当前目录）"

  distill-conversations:
    title: "蒸馏对话提取记忆和经验"
    description: "把 repowiki/raw/ 中已采集的对话蒸馏为双轨产物：notes（通用经验笔记）与 memories（任务进度记忆）。宿主 Agent 充当 LLM，distill_conversation(mode=prepare) 取 transcript → Agent 提取知识 → mode=submit 交回做去重/草稿入库/记忆落盘/评审。全程本地闭环，蒸馏产出的笔记须 confirm_note 确认，记忆自动写入当前用户的任务记忆分片文件。"
    args:
      repo_path: "仓库根目录路径（相对路径基于当前工作目录，默认当前目录）"

  task-workflow:
    title: "任务记忆工作流"
    description: "跨会话延续工作上下文：创建/关联任务、采集对话绑定 task_id、蒸馏时双轨产出笔记与任务记忆、按 task_id 检索与聚合。适用于「继续上一个任务」等长线工作场景。"
    args:
      repo_path: "仓库根目录路径（相对路径基于当前工作目录，默认当前目录）"

  consolidate-knowledge:
    title: "知识聚合（L2 场景块）"
    description: "把已确认笔记聚合为 L2 工作方法场景块（wiki/scenarios/）：prepare 获取待聚合笔记与容量预警 → 撰写/更新场景块 → reject_note 退役被吸收笔记 → submit 记录溯源并归零计数器。适用于「聚合笔记」或 aggregation_hint 提醒触发时（须先询问用户）。"
    args:
      repo_path: "仓库根目录路径（相对路径基于当前工作目录，默认当前目录）"

  skill-creator:
    title: "技能编译（SKILL.md 草稿区）"
    description: "把已确认知识（场景块 + stable 笔记 + 技能 open issues）编译为 SKILL.md 行为指令草稿（repowiki/skills/，两区制草稿区：进索引进 lint、不生效）：prepare 取候选素材/冲突预检/容量预警/写作规范 → Agent 撰写 → submit 校验落盘并写双向溯源。install/retire 为后续工单。适用于「生成技能」「把经验编成 SKILL」等场景。"
    args:
      repo_path: "仓库根目录路径（相对路径基于当前工作目录，默认当前目录）"

  promote-note:
    title: "笔记晋升为正式 wiki 页面"
    description: "把反复被采纳的 stable 笔记（wiki_stats.promotion_candidates 候选）去个人化重写为正式 wiki 页面：类型路由（pitfall/bug_fix/workaround → query，lesson/decision/architecture → concept）→ write_doc_file 写新页面（必须 draft 状态，写完提醒 confirm）→ edit_doc_file 回标原笔记 metadata.promoted_to。原笔记不删除不降级，保留作审计轨迹锚点。"
    args:
      note_file: "要晋升的笔记相对路径（如 notes/xxx.md）；留空则从 wiki_stats 的 promotion_candidates 中由用户选定"
      repo_path: "仓库根目录路径（相对路径基于当前工作目录，默认当前目录）"

# ---------------------------------------------------------------------------
# Resources（codewiki://prompts/catalog 由 prompt 注册表派生，此处只放外壳文案）
# ---------------------------------------------------------------------------
resources:
  catalog:
    usage: "通过 MCP prompts/get 协议获取完整工作流指引，或调用 get_prompt 工具获取代码生成阶段的 prompt 模板"
    argument: "{name}（{scope}）: {description}"
    optional: "可选"
    required: "必填"

  static:
    prompts_catalog:
      name: "Prompt 模板目录"
      title: "CodeWiki Prompt 模板目录"
      description: "所有可用的 Prompt 模板列表及其用途说明，帮助 agent 了解可用的工作流指引"
    capabilities:
      name: "服务能力概览"
      title: "CodeWiki 服务能力与工具清单"
      description: "完整的工具列表、参数速查、工作流说明，agent 可据此规划任务"
    page_types:
      name: "页面类型说明"
      title: "Wiki 页面类型与路由规则"
      description: "各 page_type 的用途、存储路径、frontmatter 规范和 wikilink 建图规则"

  template:
    catalog:
      name: "Wiki 页面目录"
      title: "指定 Wiki 的页面目录"
      description: "获取指定输出目录下所有 Wiki 页面的目录（标题、类型、路径），URI 中 output_dir 使用 URL 编码的绝对路径"
    module_tree:
      name: "模块聚类树"
      title: "指定 Wiki 的模块聚类树"
      description: "获取指定 Wiki 的模块聚类结构（模块名、组件数、层级关系）"
    index_status:
      name: "搜索索引状态"
      title: "指定 Wiki 的搜索索引状态"
      description: "获取 BM25 搜索索引和 wikilink 图谱的构建状态（页面数、token 数、边数）"

