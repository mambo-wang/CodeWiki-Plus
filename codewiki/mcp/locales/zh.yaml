# ---------------------------------------------------------------------------
# 内置评审清单（review_changes 的 BUILTIN_CHECKLISTS）
# questions 用 | 分隔（语料保持扁平字符串映射）
# ---------------------------------------------------------------------------
review_checklist:
  all:
    err-handling:
      title: "错误处理与资源释放"
      questions: "异常/错误是否被吞掉（空 except、忽略返回值、丢失 error）？|文件、连接、锁等资源是否在 finally / with / defer 中释放？|错误是否丢失上下文（原始异常、关键参数未随错误传播）？"
    input-validation:
      title: "输入校验"
      questions: "外部输入（参数、用户数据、文件内容）是否在入口处校验？|边界值（空、超长、负数、零、越界）是否处理？|类型/格式假设是否显式而非依赖调用方自觉？"
    logging:
      title: "日志"
      questions: "关键路径（错误、慢路径、状态变更）是否有日志？|日志是否含定位所需上下文（id、参数摘要）而非只有堆栈？|是否避免了在循环/热路径中打印高频日志？"
    security:
      title: "安全"
      questions: "是否存在注入风险（SQL/命令/模板拼接外部输入）？|密钥、token、密码是否硬编码或写进日志？|路径拼接是否存在穿越风险（未校验相对路径）？"
    concurrency:
      title: "并发安全"
      questions: "共享可变状态是否有锁或同步机制？|是否存在竞态（先查后写、非原子更新）？|新增全局/模块级可变状态是否线程安全？"
    null-boundary:
      title: "空值与边界条件"
      questions: "null/None/空集合的访问是否防护？|集合为空、索引越界、除零等边界是否考虑？|循环终止条件是否正确（off-by-one）？"
    testability:
      title: "可测试性"
      questions: "新逻辑是否可独立测试（无硬编码依赖、时间、随机）？|副作用（IO、网络、DB）是否集中在可 mock 的边界？|是否有测试覆盖本次变更的关键分支？"
    backward-compat:
      title: "向后兼容"
      questions: "公共接口/数据结构变更是否破坏既有调用方？|默认行为变更是否可能影响未显式传参的调用方？|删除/重命名是否有过渡期或同步更新全部引用？"
    performance:
      title: "性能"
      questions: "是否存在明显 N+1 查询或循环内重活（IO、正则编译、DB 调用）？|新引入的数据结构/算法量级是否匹配预期规模？|是否引入了不必要的拷贝/序列化？"
    code-quality:
      title: "代码质量"
      questions: "是否有重复逻辑可抽取（本文件或同模块已有实现）？|命名是否准确反映行为（无误导性名称）？|是否有死代码、未使用变量、注释与代码不一致？"
  python:
    py-mutable-default:
      title: "可变默认参数"
      questions: "函数参数默认值是否为可变对象（list/dict/set）——调用间共享状态？"
    py-bare-except:
      title: "裸 except"
      questions: "是否使用裸 except / except Exception 吞掉包括 KeyboardInterrupt 在内的异常？"
    py-resource-context:
      title: "资源上下文管理"
      questions: "文件、socket、锁是否使用 with 语句管理生命周期？"
    py-encoding:
      title: "编码处理"
      questions: "文件读写是否显式指定 encoding（跨平台 GBK/UTF-8 差异）？"
    py-import-side-effect:
      title: "import 副作用"
      questions: "模块导入是否触发重副作用（网络、文件写、DB 连接）？"

# ---------------------------------------------------------------------------
# 工具返回给 Agent 的提示文案（散点，随语言切换）
# ---------------------------------------------------------------------------
tools:
  note_query:
    by_file_hint: "该文件有 {total} 条历史知识（约 {total_est} tokens）。已按特异性返回前 {count} 条。够用即可开始；需要细节用 mode=detail 取单篇全文。"
    by_file_empty: "该文件没有关联的历史知识（notes/ 中无 related_modules 命中）。可能是知识空白：值得在完成任务后用 ingest_note 沉淀。"
  doc_writer:
    stale_code_advisory: "code_fingerprint 漂移：该页面此前基于另一代码状态生成（旧 {old_fp}… → 新 {new_fp}…），本次覆盖写入。旧页结论可能已过期，建议 lint_wiki stale_pages 复核。"
  review_changes:
    no_spec_note: "未找到 SPEC——仅能评审通用正确性，无法查缺失/超范围"
  wiki_lint:
    stale_note_suggestion: "超过 {overdue_days} 天未验证。确认仍然准确用 confirm_note(note_file=\"{rel_path}\") 续期（将按类型窗口刷新 stale_after），已过时用 reject_note 退役。"
    low_adoption_suggestion: "高频召回但零采纳：内容相关但可能不够 actionable。建议重写为更可执行的形式（补充具体步骤/命令/预期结果），可用 distill_conversation 产出草稿后 confirm_note，或用 edit_doc_file 直接更新 {rel_path}。"
    check_done: "检查完成: {count} 个问题"
  task_manager:
    compact_instruction: "阅读 entries_to_compress（若 existing_summary 非空，它包含此前压缩的旧摘要，新摘要应覆盖其内容），生成一份任务早期记忆的中文 Markdown 摘要，不超过 {max_chars} 字。摘要应覆盖：关键事实与已完成决策、未决事项、仍可能影响后续工作的上下文（历史坑、约定、外部依赖）。丢掉纯过程性细节，保留结论性信息。完成后调用 compact_task_memories(mode='submit', task_id=..., summary=...)。"
  prompt_server:
    draft_template: |
      📝 知识沉淀候选 ({n} 项)

      1. [{note_type/page_type}] {title}
         背景: {one line}
         结论: {one line}
         适用范围: {when this applies}

      2. ...

      要记录哪些？(全部 / 选择编号 / 跳过)
  workspace_bootstrap:
    layout_question: "首次初始化多仓工作区需要选择知识布局：请先询问用户，得到答复后带 layout 参数重新调用 init_workspace。"
    layout_colocated: "各业务仓自带 repowiki，wiki 与代码同仓演进，检索两跳（先产品级、再仓库级）"
    layout_centralized: "知识全部集中在本工作区 repowiki，业务仓为纯代码目录，检索一跳"
  distill_conversation:
    merge_marker: "> 合并自蒸馏候选：{title}"
    friction_hint: "提示：friction_score ≥ 20 的会话含明显摩擦信号（纠正/打断/重复），优先蒸馏更可能产出有价值的经验笔记（清单按 captured_at 升序排列，friction_score 供你取舍优先级）。"
