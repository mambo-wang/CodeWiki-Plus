# CodeWiki review_changes 通用评审清单模板（项目覆盖层）
# 此文件由 init_wiki 拷贝到项目的 repowiki/review_checklist.yaml；
# 目标位置已存在时跳过，不覆盖用户已自定义的内容。
#
# review_changes(mode='prepare') 时，本文件与内置清单合并：
#   - 同 id 条目：项目覆盖内置（以本文件为准）
#   - 新 id 条目：追加到清单末尾
#   - all 组：任何变更都生效
#   - python 组：仅当本次变更包含 .py 文件时生效
#
# 条目字段：
#   id        — 全局唯一标识；覆盖内置时须与内置 id 一致
#   title     — 清单项标题（评审报告中引用）
#   questions — 评审时逐条核对的问题列表
#
# 内置清单（codewiki/mcp/tools/review_checklist.py）：
#   all 组：err-handling / input-validation / logging / security /
#           concurrency / null-boundary / testability / backward-compat /
#           performance / code-quality
#   python 组：py-mutable-default / py-bare-except / py-resource-context /
#             py-encoding / py-import-side-effect

---

# ── 语言无关（all 组）────────────────────────────────────────────────────
all:
  # 覆盖内置示例：同 id 替换内置「错误处理与资源释放」（取消注释即生效）
  # - id: err-handling
  #   title: 团队错误处理约定
  #   questions:
  #     - "异常是否带上下文重新抛出（不得静默吞掉）？"
  #     - "资源是否在 finally / with / defer 中释放？"

  # 项目自定义示例（新 id 追加到清单末尾，可直接修改或删除）
  - id: team-style
    title: 团队通用风格约定
    questions:
      - "命名与既有代码风格是否一致？"

# ── Python（仅本次变更含 .py 文件时生效）─────────────────────────────────
python:
  # 项目自定义示例
  - id: py-team-logging
    title: 日志约定（团队）
    questions:
      - "是否使用 logger 而非 print？"
