[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codewiki-plus"
version = "5.4.4"
description = "Transform codebases into comprehensive documentation using AI-powered analysis"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "CodeWiki Contributors"}
]
keywords = ["documentation", "code-analysis", "ai", "llm", "developer-tools", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "click>=8.1.0",
    "keyring>=24.0.0",
    "GitPython>=3.1.40",
    "Jinja2>=3.1.6",
    "tree-sitter>=0.23.2",
    "tree-sitter-language-pack>=0.8.0",
    "tree-sitter-python>=0.23.6",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-javascript>=0.21.4",
    "tree-sitter-typescript>=0.21.2",
    "tree-sitter-c>=0.21.4",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-c-sharp>=0.23.1",
    "tree-sitter-php>=0.23.0",
    "tree-sitter-kotlin>=1.1.0",
    "tree-sitter-go>=0.23.0",
    "openai>=1.107.0",
    "litellm>=1.77.0",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "pydantic-ai>=1.0.6",
    "requests>=2.32.4",
    "python-dotenv>=1.1.1",
    "rich>=14.1.0",
    "networkx>=3.5",
    "psutil>=7.0.0",
    "PyYAML>=6.0.2",
    "ruamel.yaml>=0.18.0",
    "mermaid-parser-py>=0.0.2",
    "mermaid-py>=0.8.0",
    "fastapi>=0.116.0",
    "uvicorn>=0.35.0",
    "python-multipart>=0.0.20",
    "colorama>=0.4.6",
    "logfire>=4.1.0",
    "coding-agent-wrapper>=0.1.2",
    "mcp>=1.0.0,<2",
    "jieba>=0.42.1",
    "pathspec>=0.12.1"
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.5.0",
    "ruff==0.16.3",
    "pre-commit>=4.0.0",
]

# Keep pip-compatible extra for `pip install -e .[dev]` fallback (uv canonical is dependency-groups above)
[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.5.0",
    "ruff==0.16.3",
    "pre-commit>=4.0.0",
]

[project.scripts]
codewiki = "codewiki.cli.main:cli"

[project.urls]
Homepage = "https://github.com/mambo-wang/CodeWiki-Plus"
Documentation = "https://github.com/mambo-wang/CodeWiki-Plus/blob/main/README.md"
Repository = "https://github.com/mambo-wang/CodeWiki-Plus"
Issues = "https://github.com/mambo-wang/CodeWiki-Plus/issues"

[tool.hatch.build]
artifacts = ["codewiki/templates/**/*", "codewiki/py.typed", "codewiki/agents/**/*"]

[tool.hatch.build.targets.wheel]
packages = ["codewiki"]

[tool.uv]
managed = true
default-groups = ["dev"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Pin the rule set to the classic ruff default so lint behavior stays stable
# across ruff versions (0.16 broadened its default to include UP/BLE/S/...,
# which most of the existing codebase does not satisfy — see CI failures on
# c22fc26/99e4c44). Widen deliberately, not by upgrade accident.
select = ["E4", "E7", "E9", "F"]
# E701/E702 (multiple statements on one line) are style-only with 250+ legacy
# occurrences — relaxed in #17 until a dedicated cleanup pass.
# E741/E731 were re-tightened after fixing all violations (post-#17 cleanup);
# E501 is never active under this select, so it needs no ignore.
# E402 (import not at top) is ignored globally because 9 files intentionally
# do sys.path manipulation before imports (e.g. codewiki/run_web_app.py:11-13,
# codewiki/cli/main.py:33). Fixing would require structural refactor, not
# low-value for pre-commit gate.
ignore = ["E701", "E702", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
# Coverage is CI-only: `uv run pytest --cov=codewiki --cov-report=term-missing` (keeps `uv sync` without dev + local `uv run pytest -q` working without pytest-cov)

